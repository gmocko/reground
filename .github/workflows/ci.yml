name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core + dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint (ruff)
        run: |
          ruff check src tests benchmark examples
          ruff format --check src tests benchmark examples

      - name: Type-check (mypy --strict)
        run: mypy

      # tests/test_benchmark.py enforces the benchmark per case (0 false
      # attributions, pinned over-refusals) — a regression fails THIS step.
      - name: Tests (incl. benchmark regression gate)
        run: pytest

      - name: Run benchmark (print the matrix, offline)
        run: python benchmark/run_benchmark.py

      - name: Demo runs offline with zero deps (AC8)
        run: python examples/run_demo.py
