[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reground"
version = "0.1.0"
description = "Deterministic provenance reconstruction with safe refusal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "gmocko" }]
keywords = [
    "llm",
    "citations",
    "grounding",
    "provenance",
    "hallucination",
    "rag",
    "multi-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/gmocko/reground"
Issues = "https://github.com/gmocko/reground/issues"
Changelog = "https://github.com/gmocko/reground/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "mypy>=1.10",
    "ruff>=0.5",
]
nli = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561: ship the py.typed marker so consumers' mypy sees the strict types.
reground = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "benchmark"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "ANN",  # flake8-annotations
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests may omit type annotations and use an assert-heavy style.
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
# tests/ is checked by ruff but kept out of strict mypy (pytest/hypothesis
# fixtures use an untyped style); everything else is fully strict-typed.
files = ["src", "benchmark", "examples"]
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]
